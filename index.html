<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7658ff"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>NextMove</title>
<style>
:root{--bg:#f7f4ff;--card:#fff;--text:#251f38;--muted:#746d89;--purple:#7658ff;--pink:#ff6f91;--green:#22b573;--amber:#ffb020;--red:#ef476f;--shadow:0 12px 30px rgba(58,41,110,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#f0ebff,#fff8fb 45%,#f7f4ff);color:var(--text);min-height:100vh}.app{max-width:720px;margin:auto;padding:20px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:900}.sub{color:var(--muted);font-size:14px}.card{background:var(--card);border-radius:24px;padding:18px;margin-top:16px;box-shadow:var(--shadow);border:1px solid #eee8ff}.context{background:linear-gradient(135deg,#7658ff,#9f7cff);color:white}.row{display:flex;gap:8px;flex-wrap:wrap}.chip{border:0;border-radius:999px;padding:10px 13px;background:#f0edff;color:#4b3a97;font-weight:800;cursor:pointer}.context .chip{background:rgba(255,255,255,.2);color:#fff}.chip.active{background:#251f38;color:#fff}.context .chip.active{background:#fff;color:#5e46d4}.energy button{font-size:22px;background:transparent;border:0;cursor:pointer;padding:3px}.hero{background:linear-gradient(145deg,#fff,#fff1f7)}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--pink)}h2{margin:8px 0 6px;font-size:24px}.meta{color:var(--muted);font-size:14px}.score{display:inline-flex;align-items:center;gap:8px;background:#f2edff;border-radius:999px;padding:8px 12px;font-weight:900;color:#5e46d4;margin-top:12px}.primary{width:100%;margin-top:14px;border:0;border-radius:16px;padding:14px;background:var(--purple);color:#fff;font-weight:900;font-size:16px;cursor:pointer}.secondary{border:0;border-radius:14px;padding:10px 12px;background:#f2eff9;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.stat{background:#fff;border-radius:18px;padding:14px;text-align:center;box-shadow:var(--shadow)}.stat b{display:block;font-size:22px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.task{background:#fff;border-radius:20px;padding:15px;margin-top:10px;box-shadow:var(--shadow);border-left:6px solid var(--purple)}.task h3{margin:0 0 6px}.task-top{display:flex;justify-content:space-between;gap:10px}.badge{font-size:12px;border-radius:999px;padding:5px 8px;font-weight:900;background:#f1edff;color:#624bd7}.task-actions{display:flex;gap:8px;margin-top:12px}.fab{position:fixed;right:20px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pink),#ff9f68);color:#fff;font-size:34px;box-shadow:0 15px 30px rgba(255,111,145,.35);cursor:pointer}.modal{position:fixed;inset:0;background:rgba(28,22,49,.5);display:none;align-items:flex-end;justify-content:center;padding:14px}.modal.open{display:flex}.sheet{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 16px 16px;padding:20px}.field{margin-top:13px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd6f5;border-radius:14px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.close{float:right;border:0;background:#f2eff9;border-radius:50%;width:36px;height:36px;font-size:20px}.explain{background:#faf8ff;border-radius:14px;padding:12px;margin-top:10px;font-size:14px;display:none}.empty{text-align:center;color:var(--muted);padding:24px}@media(max-width:480px){.grid{grid-template-columns:1fr}.brand{font-size:25px}.app{padding-top:16px}}
</style>
</head><body><main class="app">
<div class="top"><div><div class="brand">NextMove ✨</div><div class="sub">Scegli la prossima mossa, senza pensarci troppo.</div></div><button id="install" class="secondary" hidden>Installa</button></div>
<section class="card context"><b>Quanto tempo ed energia hai?</b><div class="row" id="timeRow" style="margin-top:12px"></div><div class="energy" id="energyRow" style="margin-top:10px"></div></section>
<section class="card hero" id="hero"></section>
<div class="stats"><div class="stat"><b id="openCount">0</b><span>Aperti</span></div><div class="stat"><b id="doneCount">0</b><span>Fatti oggi</span></div><div class="stat"><b id="urgentCount">0</b><span>Urgenti</span></div></div>
<div class="section-head"><h2>Classifica</h2><button class="secondary" id="resetDemo">Dati demo</button></div><div id="tasks"></div>
</main><button class="fab" id="add">+</button>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><h2 id="formTitle">Nuovo task</h2><form id="form"><input type="hidden" id="taskId"><div class="field"><label>Nome</label><input id="name" required></div><div class="grid"><div class="field"><label>Categoria</label><select id="category"><option>Personale</option><option>Casa</option><option>Studio</option><option>Lavoro</option><option>Altro</option></select></div><div class="field"><label>Scadenza</label><input type="date" id="due"></div><div class="field"><label>Importanza</label><select id="importance"></select></div><div class="field"><label>Urgenza</label><select id="urgency"></select></div><div class="field"><label>Durata</label><select id="duration"><option value="5">5 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option><option value="90">90 min</option><option value="120">120+ min</option></select></div><div class="field"><label>Energia richiesta</label><select id="energy"></select></div></div><div class="field"><label>Note</label><textarea id="notes" rows="3"></textarea></div><button class="primary">Salva task</button></form></div></div>
<script>
const KEY='nextmove-v01';const demo=[{id:1,name:'Preparare documenti viaggio',category:'Personale',importance:4,urgency:4,duration:15,energy:2,due:today(1),notes:'',done:false},{id:2,name:'Chiamare il medico',category:'Personale',importance:5,urgency:4,duration:15,energy:2,due:today(0),notes:'',done:false},{id:3,name:'Sistemare la stanza',category:'Casa',importance:3,urgency:2,duration:60,energy:3,due:'',notes:'',done:false}];let state=load()||{tasks:demo,time:30,energy:3};let deferredPrompt=null;
function today(add=0){const d=new Date();d.setDate(d.getDate()+add);return d.toISOString().slice(0,10)}function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
const durationBonus={5:8,15:6,30:4,60:2,90:1,120:0};function dueBonus(due){if(!due)return 0;const now=new Date(today());const d=new Date(due);const days=Math.ceil((d-now)/86400000);if(days<0)return 20;if(days===0)return 18;if(days===1)return 15;if(days<=3)return 12;if(days<=7)return 8;if(days<=14)return 4;return 0}
function score(t){return t.importance*8+t.urgency*6+dueBonus(t.due)+(durationBonus[t.duration]||0)}function contextual(t){let s=score(t),reason='';if(state.time!=='free'&&t.duration>state.time)reason='Richiede più tempo di quello disponibile';else if(t.energy>=state.energy+2)reason='Richiede troppa energia per il momento';else if(t.energy===state.energy+1){s-=10;reason='Eseguibile con sforzo: −10 punti'}return{score:s,blocked:reason&& !reason.includes('−10'),reason}}
function label(s){return s>=70?'Fallo ora':s>=45?'Pianificalo':'Può aspettare'}function explain(t){return `+${t.importance*8} Importanza ${t.importance}<br>+${t.urgency*6} Urgenza ${t.urgency}<br>+${dueBonus(t.due)} Scadenza<br>+${durationBonus[t.duration]||0} Durata`}
function renderContext(){timeRow.innerHTML='';[15,30,60,90,'free'].forEach(v=>{const b=document.createElement('button');b.className='chip '+(state.time===v?'active':'');b.textContent=v==='free'?'Libero':v+'m';b.onclick=()=>{state.time=v;save();render()};timeRow.appendChild(b)});energyRow.innerHTML='<span style="font-weight:800;margin-right:8px">Energia</span>';for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent=i<=state.energy?'●':'○';b.onclick=()=>{state.energy=i;save();render()};energyRow.appendChild(b)}}
function ordered(){return state.tasks.filter(t=>!t.done).map(t=>({t,c:contextual(t)})).sort((a,b)=>b.c.score-a.c.score)}
function renderHero(){const pick=ordered().find(x=>!x.c.blocked);if(!pick){hero.innerHTML='<div class="eyebrow">LA TUA PROSSIMA MOSSA</div><h2>Nessun task compatibile</h2><div class="meta">Aumenta tempo o energia, oppure aggiungi un nuovo task.</div>';return}const{t,c}=pick;hero.innerHTML=`<div class="eyebrow">LA TUA PROSSIMA MOSSA</div><h2>${esc(t.name)}</h2><div class="meta">${t.category} · ${t.duration} min · Energia ${t.energy}${t.due?' · '+t.due:''}</div><div class="score">${c.score} punti · ${label(c.score)}</div><button class="secondary" style="margin-top:12px" onclick="toggleExplain('heroExp')">Perché questo task?</button><div id="heroExp" class="explain">${explain(t)}${c.reason?'<br><b>'+c.reason+'</b>':''}</div><button class="primary" onclick="completeTask(${t.id})">✓ Completa</button>`}
function renderTasks(){const arr=ordered();tasks.innerHTML=arr.length?'':'<div class="empty">Nessun task aperto.</div>';arr.forEach(({t,c})=>{const d=document.createElement('div');d.className='task';d.style.opacity=c.blocked?.58:1;d.innerHTML=`<div class="task-top"><div><h3>${esc(t.name)}</h3><div class="meta">${t.category} · ${t.duration} min · Energia ${t.energy}${t.due?' · '+t.due:''}</div></div><span class="badge">${c.score}</span></div><div class="row" style="margin-top:8px"><span class="badge">${label(c.score)}</span>${t.duration<=15?'<span class="badge">Task rapido</span>':''}</div>${c.reason?`<div class="meta" style="margin-top:8px">${c.reason}</div>`:''}<div id="e${t.id}" class="explain">${explain(t)}</div><div class="task-actions"><button class="secondary" onclick="toggleExplain('e${t.id}')">Punteggio</button><button class="secondary" onclick="editTask(${t.id})">Modifica</button><button class="secondary" onclick="completeTask(${t.id})">Completa</button></div>`;tasks.appendChild(d)})}
function renderStats(){openCount.textContent=state.tasks.filter(t=>!t.done).length;doneCount.textContent=state.tasks.filter(t=>t.done&&t.doneDate===today()).length;urgentCount.textContent=state.tasks.filter(t=>!t.done&&(t.urgency>=4||dueBonus(t.due)>=15)).length}
function render(){renderContext();renderHero();renderTasks();renderStats()}function toggleExplain(id){const e=document.getElementById(id);e.style.display=e.style.display==='block'?'none':'block'}function completeTask(id){const t=state.tasks.find(x=>x.id===id);t.done=true;t.doneDate=today();save();render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openForm(t){modal.classList.add('open');taskId.value=t?.id||'';formTitle.textContent=t?'Modifica task':'Nuovo task';name.value=t?.name||'';category.value=t?.category||'Personale';due.value=t?.due||'';importance.value=t?.importance||3;urgency.value=t?.urgency||3;duration.value=t?.duration||30;energy.value=t?.energy||3;notes.value=t?.notes||''}function editTask(id){openForm(state.tasks.find(x=>x.id===id))}
add.onclick=()=>openForm();close.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};form.onsubmit=e=>{e.preventDefault();const data={id:taskId.value?Number(taskId.value):Date.now(),name:name.value.trim(),category:category.value,due:due.value,importance:+importance.value,urgency:+urgency.value,duration:+duration.value,energy:+energy.value,notes:notes.value,done:false};const i=state.tasks.findIndex(x=>x.id===data.id);if(i>=0)data.done=state.tasks[i].done,state.tasks[i]=data;else state.tasks.push(data);save();modal.classList.remove('open');render()};resetDemo.onclick=()=>{state={tasks:structuredClone(demo),time:30,energy:3};save();render()};
for(let i=1;i<=5;i++){importance.add(new Option(i,i));urgency.add(new Option(i,i));energy.add(new Option(i,i))}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.hidden=false});install.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.hidden=true}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
